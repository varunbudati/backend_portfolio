    <figure class="slide gallery-item">
      <img src="{{ url_for('static', filename='images/events/DSC_0667.jpeg') }}" alt="Event photo with colleagues" loading="lazy" />

    </figure>
    <figure class="slide gallery-item">
      <img src="{{ url_for('static', filename='images/events/DSC_0799.jpeg') }}" alt="Speaker on stage during an event" loading="lazy" />

  <div class="gallery-lightbox" data-gallery-lightbox="events" aria-hidden="true" role="dialog" aria-label="Events gallery viewer">

      </button>
